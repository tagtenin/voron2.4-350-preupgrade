[mcu]
#serial: /dev/serial/by-id/
canbus_uuid: 158bd114740f
#restart_method: command

[mcu ebb36]
canbus_uuid: 22ff9fe0fa1a

[include mainsail.cfg]

[include moonraker_obico_macros.cfg]

[include xyz_axis.cfg]
#[include extruder.cfg] # Removed in favor of EBB36
[include ebb36.cfg]
[include bed.cfg]
[include cartographer.cfg]
#[include fans.cfg]
[include homing-and-gantry-adjustment.cfg]
[include print_start.cfg]
[include macros.cfg]

[printer]
kinematics: corexy
max_accel: 3000             #Max 4000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0
max_velocity: 15 #Added because of Klipper error. Try to remove later. 

##From EBB36 cfg example:
## PROBE - MOVE THIS TO printer.cfg or your probe offsets will fail!
#[probe]
#pin: ^can0:LIMIT_1
#x_offset: -29.8
#y_offset: -13.5
#z_offset: 2.202
#speed: 5
#samples: 3
#sample_retract_dist: 2
#lift_speed: 5.0
#samples_result: median
#samples_tolerance: 0.02
#samples_tolerance_retries: 5

## EXTRUDER 
[extruder]
step_pin: ebb36:EXT_STEP
dir_pin: !ebb36:EXT_DIR
enable_pin: !ebb36:EXT_EN
#rotation_distance: 22.67895 #for 5mm Shaft Driven Bondtech gearsets
rotation_distance: 22.6789511 #26.72306036
gear_ratio: 50:10
microsteps: 32
full_steps_per_rotation: 200 #1.8deg Motor
max_extrude_only_distance: 1400.0
max_extrude_only_velocity: 75.0
max_extrude_only_accel: 1500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: ebb36:HE0
sensor_pin: ebb36:TH0
sensor_type: Generic 3950 #ATC Semitec 104GT-2  # this is the default for the Revo heater
#pullup_resistor: 2200            # 4700 is default and does not need defining, 2200 is used for the PT1000             
min_temp: 10
max_temp: 270
max_power: 1.0
min_extrude_temp: 170
#control = pid
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721

